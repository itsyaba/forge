# Every push to main becomes a GitHub Release with an installable Android APK.
#
# Version: <major.minor from app.json>.<run number>, e.g. v1.0.27.
# The APK is signed with the debug key from the Expo template, so it installs by
# sideloading (allow "install unknown apps"). It is not a Play Store build.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: 1
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Check
        run: |
          npx tsc --noEmit
          npx eslint src
          npx jest --ci

      - name: Version
        id: version
        run: |
          base=$(node -p "require('./app.json').expo.version.split('.').slice(0, 2).join('.')")
          version="$base.${{ github.run_number }}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          node -e "
            const fs = require('fs');
            const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            app.expo.version = '$version';
            app.expo.android.versionCode = ${{ github.run_number }};
            fs.writeFileSync('app.json', JSON.stringify(app, null, 2));
          "

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Build APK
        run: |
          npx expo prebuild --platform android --no-install
          cd android
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,x86_64
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/forge-${{ steps.version.outputs.tag }}.apk"

      - name: Release notes
        run: |
          prev=$(git describe --tags --abbrev=0 2>/dev/null || true)
          {
            echo "Install: download \`forge-${{ steps.version.outputs.tag }}.apk\` below on an Android phone and open it."
            echo
            echo "## Changes"
            if [ -n "$prev" ]; then
              git log "$prev..HEAD" --no-merges --pretty='- %s'
            else
              git log --no-merges --pretty='- %s'
            fi
          } > notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "forge-${{ steps.version.outputs.tag }}.apk" \
            --target "$GITHUB_SHA" \
            --title "FORGE ${{ steps.version.outputs.tag }}" \
            --notes-file notes.md
